{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="container auth-wrapper">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white mb-2">Welcome Back</h2>
                    <p class="text-secondary">Sign in to your account</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}" class="needs-validation" novalidate>
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required>
                        <div class="invalid-feedback">
                            Please enter a valid email.
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="password" class="form-label mb-0">Password</label>
                        </div>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                        <div class="invalid-feedback">
                            Please enter your password.
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">Sign In</button>
                    
                    <p class="text-center text-secondary mb-0">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-accent text-decoration-none fw-bold" style="color: var(--accent-color);">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
